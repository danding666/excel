<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">机器学习全流程</title>
  <desc id="desc">从业务目标、数据采集、数据处理、特征工程、模型训练、评估优化到部署监控的机器学习流程图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#10274a"/>
      <stop offset="1" stop-color="#0c3b4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 52px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; letter-spacing: 2px; }
      .subtitle { font: 400 20px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #a5c4dc; letter-spacing: 1px; }
      .step { font: 700 24px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
      .detail { font: 400 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b9cee2; }
      .number { font: 700 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #082f49; }
      .label { font: 500 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #bae6fd; }
      .card { fill: #122844; stroke: #2f5975; stroke-width: 1.5; }
      .icon { fill: none; stroke: #7dd3fc; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .connector { fill: none; stroke: #7dd3fc; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1460" cy="30" r="310" fill="#0ea5e9" opacity=".08"/>
  <circle cx="100" cy="880" r="330" fill="#14b8a6" opacity=".07"/>
  <path d="M0 735 C320 640 420 855 760 755 S1260 655 1600 770 V900 H0Z" fill="#38bdf8" opacity=".035"/>

  <text x="800" y="88" text-anchor="middle" class="title">机器学习全流程</text>
  <rect x="648" y="112" width="304" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
  <text x="800" y="151" text-anchor="middle" class="subtitle">从业务问题到持续产生价值的智能系统</text>

  <!-- Connectors -->
  <path class="connector" d="M296 337 H336"/>
  <path class="connector" d="M516 337 H556"/>
  <path class="connector" d="M736 337 H776"/>
  <path class="connector" d="M956 337 H996"/>
  <path class="connector" d="M1176 337 H1216"/>
  <path class="connector" d="M1306 426 V482"/>
  <path class="connector" d="M1216 575 H1176"/>
  <path class="connector" d="M996 575 H956"/>
  <path class="connector" d="M776 575 H736"/>
  <path class="connector" d="M556 575 H516"/>
  <path class="connector" d="M336 575 H296"/>
  <path class="connector" d="M206 664 V716 H866 V664"/>
  <text x="536" y="747" text-anchor="middle" class="label">监控反馈 · 数据漂移 · 业务变化</text>

  <!-- Step 1 -->
  <g transform="translate(116 248)" filter="url(#shadow)">
    <rect class="card" width="180" height="178" rx="22"/>
    <circle cx="28" cy="28" r="17" fill="#5eead4"/><text x="28" y="34" text-anchor="middle" class="number">01</text>
    <g class="icon" transform="translate(70 35)">
      <circle cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="7"/>
      <path d="M20 3V-5 M37 20h8 M20 37v8 M3 20h-8"/>
    </g>
    <text x="90" y="105" text-anchor="middle" class="step">定义目标</text>
    <text x="90" y="136" text-anchor="middle" class="detail">业务问题 · 成功指标</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(336 248)" filter="url(#shadow)">
    <rect class="card" width="180" height="178" rx="22"/>
    <circle cx="28" cy="28" r="17" fill="#67e8f9"/><text x="28" y="34" text-anchor="middle" class="number">02</text>
    <g class="icon" transform="translate(67 34)">
      <ellipse cx="23" cy="6" rx="23" ry="8"/><path d="M0 6v30c0 5 10 9 23 9s23-4 23-9V6"/>
      <path d="M0 21c0 5 10 9 23 9s23-4 23-9"/>
    </g>
    <text x="90" y="105" text-anchor="middle" class="step">采集数据</text>
    <text x="90" y="136" text-anchor="middle" class="detail">获取 · 标注 · 治理</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(556 248)" filter="url(#shadow)">
    <rect class="card" width="180" height="178" rx="22"/>
    <circle cx="28" cy="28" r="17" fill="#7dd3fc"/><text x="28" y="34" text-anchor="middle" class="number">03</text>
    <g class="icon" transform="translate(66 34)">
      <path d="M2 2h47L33 23v19l-14 7V23Z"/><path d="M35 4l9 9"/>
    </g>
    <text x="90" y="105" text-anchor="middle" class="step">处理数据</text>
    <text x="90" y="136" text-anchor="middle" class="detail">清洗 · 探索 · 划分</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(776 248)" filter="url(#shadow)">
    <rect class="card" width="180" height="178" rx="22"/>
    <circle cx="28" cy="28" r="17" fill="#93c5fd"/><text x="28" y="34" text-anchor="middle" class="number">04</text>
    <g class="icon" transform="translate(66 32)">
      <path d="M4 44h44 M9 38V22 M21 38V8 M33 38V28 M45 38V15"/>
      <circle cx="9" cy="18" r="3"/><circle cx="21" cy="4" r="3"/><circle cx="33" cy="24" r="3"/><circle cx="45" cy="11" r="3"/>
    </g>
    <text x="90" y="105" text-anchor="middle" class="step">特征工程</text>
    <text x="90" y="136" text-anchor="middle" class="detail">选择 · 构造 · 转换</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(996 248)" filter="url(#shadow)">
    <rect class="card" width="180" height="178" rx="22"/>
    <circle cx="28" cy="28" r="17" fill="#a5b4fc"/><text x="28" y="34" text-anchor="middle" class="number">05</text>
    <g class="icon" transform="translate(65 32)">
      <circle cx="25" cy="25" r="10"/><circle cx="25" cy="25" r="21"/>
      <path d="M25 4v8 M25 38v8 M4 25h8 M38 25h8 M10 10l6 6 M34 34l6 6 M40 10l-6 6 M16 34l-6 6"/>
    </g>
    <text x="90" y="105" text-anchor="middle" class="step">训练模型</text>
    <text x="90" y="136" text-anchor="middle" class="detail">算法选择 · 参数学习</text>
  </g>

  <!-- Step 6 -->
  <g transform="translate(1216 248)" filter="url(#shadow)">
    <rect class="card" width="180" height="178" rx="22"/>
    <circle cx="28" cy="28" r="17" fill="#c4b5fd"/><text x="28" y="34" text-anchor="middle" class="number">06</text>
    <g class="icon" transform="translate(66 33)">
      <path d="M3 45V4 M3 45h45"/><path d="M9 36l11-12 10 6 14-19"/>
      <path d="M37 11h7v7"/>
    </g>
    <text x="90" y="105" text-anchor="middle" class="step">评估优化</text>
    <text x="90" y="136" text-anchor="middle" class="detail">验证 · 调参 · 对比</text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(1216 486)" filter="url(#shadow)">
    <rect class="card" width="180" height="178" rx="22" stroke="#5eead4"/>
    <circle cx="28" cy="28" r="17" fill="#5eead4"/><text x="28" y="34" text-anchor="middle" class="number">07</text>
    <g class="icon" transform="translate(66 32)">
      <path d="M25 3l20 9v13c0 13-8 21-20 27C13 46 5 38 5 25V12Z"/>
      <path d="M16 27l6 6 13-15"/>
    </g>
    <text x="90" y="105" text-anchor="middle" class="step">上线部署</text>
    <text x="90" y="136" text-anchor="middle" class="detail">服务化 · 集成 · 发布</text>
  </g>

  <!-- Step 8 -->
  <g transform="translate(996 486)" filter="url(#shadow)">
    <rect class="card" width="180" height="178" rx="22" stroke="#5eead4"/>
    <circle cx="28" cy="28" r="17" fill="#5eead4"/><text x="28" y="34" text-anchor="middle" class="number">08</text>
    <g class="icon" transform="translate(65 33)">
      <path d="M4 39V15h42v24Z"/><path d="M11 33l8-10 8 6 11-14"/><path d="M17 46h16 M25 39v7"/>
    </g>
    <text x="90" y="105" text-anchor="middle" class="step">持续监控</text>
    <text x="90" y="136" text-anchor="middle" class="detail">性能 · 漂移 · 告警</text>
  </g>

  <!-- Iteration block -->
  <g transform="translate(116 486)" filter="url(#shadow)">
    <rect width="620" height="178" rx="22" fill="#0e2941" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="8 7"/>
    <g class="icon" transform="translate(39 58)">
      <path d="M11 13A28 28 0 0 1 56 9"/><path d="M56 9V0 M56 9h-9"/>
      <path d="M56 43A28 28 0 0 1 11 47"/><path d="M11 47v9 M11 47h9"/>
    </g>
    <text x="122" y="72" class="step">迭代实验</text>
    <text x="122" y="106" class="detail">实验追踪　·　误差分析　·　模型与特征持续改进</text>
    <text x="122" y="138" class="detail">离线指标与业务指标共同决定是否进入部署阶段</text>
  </g>

  <g transform="translate(1032 801)">
    <circle cx="0" cy="0" r="5" fill="#5eead4"/>
    <text x="16" y="6" class="label">核心原则：数据驱动、小步验证、闭环迭代</text>
  </g>
</svg>
